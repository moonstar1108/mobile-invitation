<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<title>프랑스어 여행 회화 퀴즈</title>
<!-- PWA 메타 태그 (외부 CDN 없음 / 아이콘은 인라인 SVG 데이터 URI) -->
<meta name="theme-color" content="#F2F2F7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="프랑스어 여행">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="오프라인으로 동작하는 프랑스 여행 회화 퀴즈 200문장">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230055A4'/%3E%3Crect x='118' y='0' width='62' height='180' fill='%23EF4135'/%3E%3Ctext x='72' y='120' font-size='76' font-weight='bold' text-anchor='middle' fill='white' font-family='sans-serif'%3EFR%3C/text%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230055A4'/%3E%3Crect x='42' y='0' width='22' height='64' fill='%23EF4135'/%3E%3Ctext x='26' y='43' font-size='26' font-weight='bold' text-anchor='middle' fill='white' font-family='sans-serif'%3EFR%3C/text%3E%3C/svg%3E">
<style>
/* ===== 전부 Pure CSS. 외부 폰트/CSS 라이브러리를 쓰지 않습니다. ===== */
:root{
  --bg:#F2F2F7;
  --card:#FFFFFF;
  --text:#1C1C1E;
  --sub:#6D6D72;
  --blue:#0055A4;          /* 프랑스 국기 파랑 */
  --blue-soft:rgba(0,85,164,0.09);
  --red:#EF4135;           /* 프랑스 국기 빨강 */
  --red-soft:rgba(239,65,53,0.10);
  --green:#34C759;
  --border:rgba(60,60,67,0.13);
  --tabbar-bg:rgba(249,249,249,0.86);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000;
    --card:#1C1C1E;
    --text:#F2F2F7;
    --sub:#98989D;
    --blue:#6BA6FF;
    --blue-soft:rgba(107,166,255,0.15);
    --red:#FF6B60;
    --red-soft:rgba(255,107,96,0.15);
    --border:rgba(255,255,255,0.14);
    --tabbar-bg:rgba(28,28,30,0.86);
  }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{
  height:100%; margin:0;
  overscroll-behavior:none;            /* 스크롤 튐 방지 */
  background:var(--bg); color:var(--text);
  font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
  -webkit-font-smoothing:antialiased;
}
body{position:fixed; inset:0; overflow:hidden; display:flex; flex-direction:column;}
button{font-family:inherit; touch-action:manipulation;}
#app{display:flex; flex-direction:column; height:100%; width:100%;}

/* ===== 상단 바 : 노치 / Dynamic Island 대응 ===== */
header.topbar{
  flex:0 0 auto;
  padding-top:calc(10px + env(safe-area-inset-top));
  padding-right:calc(18px + env(safe-area-inset-right));
  padding-bottom:12px;
  padding-left:calc(18px + env(safe-area-inset-left));
  background:var(--card);
  border-bottom:1px solid var(--border);
}
.topbar-row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px;}
.cat-chip{
  display:inline-block; padding:5px 12px; border-radius:100px;
  background:var(--blue-soft); color:var(--blue);
  font-size:13px; font-weight:600; max-width:62%;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.progress-text{font-size:13px; color:var(--sub); font-weight:600; font-variant-numeric:tabular-nums; flex:0 0 auto;}
.progress-track{height:6px; border-radius:3px; background:var(--border); overflow:hidden;}
.progress-fill{height:100%; border-radius:3px; background:var(--blue); width:0%; transition:width .35s ease;}

main{
  flex:1 1 auto; overflow-y:auto; overflow-x:hidden;   /* 가로 스크롤 방지 */
  -webkit-overflow-scrolling:touch; overscroll-behavior-y:contain;
  padding-top:16px; padding-bottom:24px;
  padding-right:calc(18px + env(safe-area-inset-right));
  padding-left:calc(18px + env(safe-area-inset-left));
}
.view{display:none;}
.view.active{display:block;}

/* ===== 카테고리 선택 칩 ===== */
.chip-scroll{
  display:flex; gap:8px; overflow-x:auto; overflow-y:hidden;
  -webkit-overflow-scrolling:touch; padding-bottom:12px; scrollbar-width:none;
}
.chip-scroll::-webkit-scrollbar{display:none;}
.pick{
  flex:0 0 auto; padding:8px 14px; border-radius:100px; min-height:36px;
  background:var(--card); border:1px solid var(--border);
  color:var(--sub); font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap;
}
.pick.active{background:var(--blue); color:#fff; border-color:var(--blue);}
.pick:active{opacity:.7;}

/* ===== 카드 ===== */
.card{
  background:var(--card); border-radius:20px; padding:24px 20px;
  box-shadow:0 1px 2px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.06);
  margin-bottom:16px;
  overflow-wrap:break-word; word-break:break-word;   /* 긴 문장 삐져나옴 방지 */
}
.kr-question{
  font-size:23px; font-weight:700; line-height:1.45; text-align:center;
  padding:18px 4px 24px 4px; min-height:56px;
}
.btn{
  display:block; width:100%; border:none; border-radius:14px;
  padding:17px 16px; min-height:52px;                 /* 충분한 터치 영역 */
  font-size:16px; font-weight:600; cursor:pointer;
  transition:transform .12s ease, opacity .12s ease;
}
.btn:active{transform:scale(0.97); opacity:0.82;}
.btn-primary{background:var(--blue); color:#fff;}
.btn-secondary{background:var(--red-soft); color:var(--red);}
.btn-ghost{background:var(--bg); color:var(--text); border:1px solid var(--border);}
.btn-danger{background:rgba(255,59,48,0.10); color:#FF3B30;}
.btn-row{display:flex; gap:10px; margin-top:14px;}
.btn-row .btn{flex:1;}

/* ===== 정답 영역 ===== */
.answer{display:none; margin-top:6px; padding-top:20px; border-top:1px solid var(--border);}
.answer.show{display:block; animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}
.row{margin-bottom:18px;}
.row:last-child{margin-bottom:0;}
.row-label{font-size:12px; font-weight:700; color:var(--sub); margin-bottom:6px;}
.fr-line{display:flex; align-items:flex-start; gap:10px;}
.fr-text{
  font-size:26px; font-weight:700; line-height:1.35; color:var(--blue); flex:1;
  overflow-wrap:break-word; word-break:break-word;
}
.pron-text{font-size:18px; font-weight:700; color:var(--red);}
.pron-hint{font-size:11px; color:var(--sub); margin-top:5px; line-height:1.5;}
.speak-btn{
  flex:0 0 auto; width:46px; height:46px; border-radius:23px; border:none;
  background:var(--blue-soft); color:var(--blue); font-size:20px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:transform .12s ease, opacity .12s ease;
}
.speak-btn:active{transform:scale(0.9); opacity:.7;}
.speak-btn.small{width:34px; height:34px; border-radius:17px; font-size:15px;}
.speak-btn[disabled]{opacity:.35;}
.grammar-box{
  background:var(--blue-soft); border-radius:14px; padding:14px 16px;
  font-size:14px; line-height:1.6; color:var(--text);
}
.grammar-box .glabel{color:var(--blue); font-weight:700; margin-bottom:5px; display:block;}
.kw-list{display:flex; flex-direction:column; gap:8px;}
.kw{
  display:flex; align-items:center; gap:10px;
  background:var(--bg); border:1px solid var(--border);
  border-radius:12px; padding:10px 12px;
}
.kw-main{flex:1; min-width:0;}
.kw-word{font-size:15px; font-weight:700; color:var(--blue); overflow-wrap:break-word;}
.kw-mean{font-size:12.5px; color:var(--sub); margin-top:2px;}
.kw-pron{font-size:12.5px; color:var(--red); font-weight:600; margin-top:1px;}

/* ===== 완료 화면 ===== */
.done-card{text-align:center; padding:34px 22px;}
.done-emoji{font-size:52px; line-height:1;}
.done-title{font-size:20px; font-weight:700; margin:14px 0 6px;}
.done-desc{font-size:14px; color:var(--sub); line-height:1.6; margin-bottom:22px;}

/* ===== 저장된 단어장 ===== */
.empty{text-align:center; color:var(--sub); padding:56px 20px; font-size:15px; line-height:1.7; white-space:pre-line;}
.saved-item{
  background:var(--card); border-radius:16px; padding:16px 18px; margin-bottom:12px;
  box-shadow:0 1px 2px rgba(0,0,0,0.04); overflow-wrap:break-word;
}
.saved-head{display:flex; justify-content:space-between; align-items:center; gap:10px; cursor:pointer;}
.saved-cat{font-size:11px; color:var(--blue); font-weight:700; margin-bottom:4px;}
.saved-kr{font-size:16px; font-weight:600; flex:1;}
.chev{color:var(--sub); font-size:14px; transition:transform .2s ease; flex:0 0 auto;}
.chev.open{transform:rotate(90deg);}
.saved-detail{display:none; margin-top:14px; padding-top:14px; border-top:1px solid var(--border);}
.saved-detail.show{display:block;}
.saved-actions{margin-top:14px;}
.saved-actions .btn{padding:12px; min-height:44px; font-size:14px;}
.count-line{font-size:13px; font-weight:700; color:var(--sub); margin:2px 2px 12px;}

/* ===== 하단 탭 바 : 홈 인디케이터 대응 ===== */
nav.tabbar{
  flex:0 0 auto; display:flex;
  background:var(--tabbar-bg);
  -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px);  /* 반투명 블러 */
  border-top:1px solid var(--border);
  padding-top:8px;
  padding-bottom:calc(6px + env(safe-area-inset-bottom));
  padding-right:env(safe-area-inset-right);
  padding-left:env(safe-area-inset-left);
}
.tab{
  flex:1; background:none; border:none; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:6px 0 2px; min-height:48px;
  color:var(--sub); font-size:11px; font-weight:600;
}
.tab .ico{font-size:22px; line-height:1;}
.tab.active{color:var(--blue);}
.tab:active{opacity:.6;}

/* ===== 토스트 ===== */
#toast{
  position:fixed; left:50%; bottom:calc(94px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(20px);
  background:rgba(28,28,30,0.93); color:#fff;
  padding:12px 22px; border-radius:100px;
  font-size:14px; font-weight:600; opacity:0; pointer-events:none;
  transition:opacity .25s ease, transform .25s ease; z-index:999;
  max-width:88vw; text-align:center;
  -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="topbar-row">
      <span class="cat-chip" id="catChip">기본 인사</span>
      <span class="progress-text" id="progressText">1 / 200</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </header>

  <main>
    <!-- ============ 퀴즈 화면 ============ -->
    <section class="view active" id="view-quiz">
      <div class="chip-scroll" id="catPicker"></div>

      <div class="card" id="quizCard">
        <div class="kr-question" id="krQuestion"></div>

        <button class="btn btn-primary" id="revealBtn">답 확인</button>

        <div class="answer" id="answerBox">
          <div class="row">
            <div class="row-label">① 프랑스어</div>
            <div class="fr-line">
              <div class="fr-text" id="frText"></div>
              <button class="speak-btn" id="speakBtn" aria-label="프랑스어 발음 듣기">🔊</button>
            </div>
          </div>

          <div class="row">
            <div class="row-label">② 한글 발음</div>
            <div class="pron-text" id="pronText"></div>
            <div class="pron-hint">한글 표기는 발음을 돕기 위한 것으로 실제 프랑스어 소리와 완전히 같지는 않아요. 🔊 버튼으로 꼭 들어보세요.</div>
          </div>

          <div class="row" id="kwRow">
            <div class="row-label">③ 핵심 단어</div>
            <div class="kw-list" id="kwList"></div>
          </div>

          <div class="row">
            <div class="grammar-box">
              <span class="glabel">💡 핵심 문법·문형 포인트</span>
              <span id="grammarText"></span>
            </div>
          </div>
        </div>

        <div class="btn-row" id="actionRow">
          <button class="btn btn-secondary" id="saveBtn">헷갈려요 🔖</button>
          <button class="btn btn-primary" id="nextBtn">다음 문제 →</button>
        </div>
      </div>

      <!-- 마지막 문제 이후 완료 화면 -->
      <div class="card done-card" id="doneCard" style="display:none;">
        <div class="done-emoji">🎉</div>
        <div class="done-title">한 바퀴 다 돌았어요!</div>
        <div class="done-desc" id="doneDesc"></div>
        <button class="btn btn-primary" id="restartBtn">처음부터 다시 풀기</button>
        <div style="height:10px;"></div>
        <button class="btn btn-ghost" id="allCatBtn">전체 200문장으로 돌아가기</button>
        <div class="pron-hint" style="margin-top:14px;">위쪽 카테고리 칩에서 원하는 상황만 골라 복습할 수도 있어요.</div>
      </div>
    </section>

    <!-- ============ 저장된 단어장 ============ -->
    <section class="view" id="view-saved">
      <div class="count-line" id="savedCount"></div>
      <div id="savedList"></div>
    </section>
  </main>

  <nav class="tabbar">
    <button class="tab active" id="tabQuiz"><span class="ico">📝</span><span>퀴즈 풀기</span></button>
    <button class="tab" id="tabSaved"><span class="ico">🔖</span><span>저장된 단어장</span></button>
  </nav>
</div>

<div id="toast"></div>

<script>
"use strict";
/* ===================== 프랑스 여행 회화 200문장 ===================== */
var DATA = [
{id:1,category:"기본 인사",kr:"안녕하세요.",fr:"Bonjour.",pronunciation:"봉주르",grammar:"낮 시간대 인사이자 가게에 들어설 때의 필수 예절이에요. 이 한마디 없이 말을 걸면 무례하게 느껴질 수 있어요.",keywords:[{word:"bonjour",meaning:"안녕하세요",pron:"봉주르"}]},
{id:2,category:"기본 인사",kr:"안녕하세요. (저녁)",fr:"Bonsoir.",pronunciation:"봉수아르",grammar:"해가 진 뒤에는 Bonjour 대신 Bonsoir를 써요. 대략 저녁 6시 이후예요.",keywords:[{word:"soir",meaning:"저녁",pron:"수아르"}]},
{id:3,category:"기본 인사",kr:"안녕. (친구에게)",fr:"Salut !",pronunciation:"살뤼",grammar:"만날 때와 헤어질 때 모두 쓰는 반말 인사예요. 친구나 또래에게만 쓰세요.",keywords:[{word:"salut",meaning:"안녕",pron:"살뤼"}]},
{id:4,category:"기본 인사",kr:"안녕히 가세요.",fr:"Au revoir.",pronunciation:"오 르부아르",grammar:"가게를 나올 때도 꼭 하는 인사예요. 직역하면 '다시 볼 때까지'예요.",keywords:[{word:"au revoir",meaning:"안녕히 가세요",pron:"오 르부아르"}]},
{id:5,category:"기본 인사",kr:"좋은 하루 보내세요.",fr:"Bonne journée !",pronunciation:"본 주르네",grammar:"헤어질 때 Au revoir 뒤에 덧붙이면 아주 자연스러워요. 저녁에는 Bonne soirée를 써요.",keywords:[{word:"journée",meaning:"하루",pron:"주르네"}]},
{id:6,category:"기본 인사",kr:"안녕히 주무세요.",fr:"Bonne nuit.",pronunciation:"본 뉘",grammar:"잠자리에 들 때만 써요. 저녁에 헤어질 때는 Bonne soirée가 맞아요.",keywords:[{word:"nuit",meaning:"밤",pron:"뉘"}]},
{id:7,category:"기본 인사",kr:"곧 또 봬요.",fr:"À bientôt !",pronunciation:"아 비앙토",grammar:"À + 시점으로 '그때 봐요'를 만들어요. À demain(내일 봐요)처럼 응용할 수 있어요.",keywords:[{word:"bientôt",meaning:"곧",pron:"비앙토"}]},
{id:8,category:"기본 인사",kr:"잘 지내세요?",fr:"Comment allez-vous ?",pronunciation:"코망 탈레 부",grammar:"정중한 안부 인사예요. comment과 allez가 이어져 [코망 탈레]로 발음돼요.",keywords:[{word:"comment",meaning:"어떻게",pron:"코망"}]},
{id:9,category:"기본 인사",kr:"잘 지내요, 감사합니다.",fr:"Ça va bien, merci.",pronunciation:"사 바 비앙 메르시",grammar:"Ça va는 안부를 묻고 답하는 데 모두 쓰는 만능 표현이에요. 끝을 올리면 질문이 돼요.",keywords:[{word:"bien",meaning:"잘",pron:"비앙"}]},
{id:10,category:"기본 인사",kr:"반갑습니다.",fr:"Enchanté.",pronunciation:"앙샹테",grammar:"처음 만났을 때 쓰는 인사예요. 말하는 사람이 여성이면 Enchantée로 쓰지만 발음은 같아요.",keywords:[{word:"enchanté",meaning:"반가운",pron:"앙샹테"}]},
{id:11,category:"자기소개",kr:"저는 민수라고 합니다.",fr:"Je m'appelle Minsu.",pronunciation:"즈 마펠 민수",grammar:"직역하면 '저는 저를 ~라고 부릅니다'예요. 이름을 말할 때 쓰는 가장 기본 표현이에요.",keywords:[{word:"je",meaning:"나는",pron:"즈"},{word:"s'appeler",meaning:"이름이 ~이다",pron:"사플레"}]},
{id:12,category:"자기소개",kr:"저는 한국 사람입니다.",fr:"Je suis coréen.",pronunciation:"즈 쉬 코레앙",grammar:"être(이다) 동사의 je 형태가 suis예요. 여성은 coréenne(코레엔)으로 써요.",keywords:[{word:"suis",meaning:"~이다",pron:"쉬"},{word:"coréen",meaning:"한국인",pron:"코레앙"}]},
{id:13,category:"자기소개",kr:"한국에서 왔어요.",fr:"Je viens de Corée.",pronunciation:"즈 비앙 드 코레",grammar:"venir de는 '~에서 오다'예요. 나라 이름 앞 관사는 de와 만나 사라져요.",keywords:[{word:"venir",meaning:"오다",pron:"브니르"},{word:"Corée",meaning:"한국",pron:"코레"}]},
{id:14,category:"자기소개",kr:"프랑스어를 조금 해요.",fr:"Je parle un peu français.",pronunciation:"즈 파를 앙 푀 프랑세",grammar:"언어 이름 앞에는 관사를 붙이지 않아요. un peu는 '조금'이에요.",keywords:[{word:"parler",meaning:"말하다",pron:"파를레"},{word:"un peu",meaning:"조금",pron:"앙 푀"}]},
{id:15,category:"자기소개",kr:"영어 하세요?",fr:"Parlez-vous anglais ?",pronunciation:"파를레 부 장글레",grammar:"동사와 주어를 뒤집어 만드는 정중한 의문문이에요. vous와 anglais가 이어져 [부 장글레]가 돼요.",keywords:[{word:"anglais",meaning:"영어",pron:"앙글레"}]},
{id:16,category:"자기소개",kr:"관광하러 왔어요.",fr:"Je suis ici pour le tourisme.",pronunciation:"즈 쉬 지시 푸르 르 투리슴",grammar:"pour는 '~을 위해'라는 목적을 나타내요. 입국 심사에서 그대로 쓸 수 있어요.",keywords:[{word:"ici",meaning:"여기",pron:"이시"},{word:"pour",meaning:"~을 위해",pron:"푸르"}]},
{id:17,category:"감사·사과",kr:"감사합니다.",fr:"Merci.",pronunciation:"메르시",grammar:"가장 기본적인 감사 표현이에요. 무언가를 사양할 때 Non, merci로도 써요.",keywords:[{word:"merci",meaning:"감사합니다",pron:"메르시"}]},
{id:18,category:"감사·사과",kr:"정말 감사합니다.",fr:"Merci beaucoup.",pronunciation:"메르시 보쿠",grammar:"beaucoup은 '많이'예요. 끝의 p는 소리 나지 않아요.",keywords:[{word:"beaucoup",meaning:"많이",pron:"보쿠"}]},
{id:19,category:"감사·사과",kr:"천만에요.",fr:"De rien.",pronunciation:"드 리앙",grammar:"'별것 아니에요'라는 뜻이에요. 더 정중하게는 Je vous en prie를 써요.",keywords:[{word:"rien",meaning:"아무것도 아닌 것",pron:"리앙"}]},
{id:20,category:"감사·사과",kr:"죄송합니다.",fr:"Je suis désolé.",pronunciation:"즈 쉬 데졸레",grammar:"잘못을 사과할 때 써요. 여성은 désolée로 쓰지만 발음은 같아요.",keywords:[{word:"désolé",meaning:"미안한",pron:"데졸레"}]},
{id:21,category:"감사·사과",kr:"실례합니다.",fr:"Excusez-moi.",pronunciation:"엑스퀴제 무아",grammar:"말을 걸거나 사람 사이를 지나갈 때 쓰는 표현이에요. 사과의 désolé와는 쓰임이 달라요.",keywords:[{word:"excuser",meaning:"용서하다",pron:"엑스퀴제"}]},
{id:22,category:"감사·사과",kr:"괜찮아요.",fr:"Ce n'est pas grave.",pronunciation:"스 네 파 그라브",grammar:"상대의 사과에 답할 때 써요. 회화에서는 C'est pas grave로 ne를 생략해요.",keywords:[{word:"grave",meaning:"심각한",pron:"그라브"}]},
{id:23,category:"감사·사과",kr:"도와주셔서 감사합니다.",fr:"Merci pour votre aide.",pronunciation:"메르시 푸르 보트르 에드",grammar:"merci pour + 명사로 감사의 이유를 붙여요.",keywords:[{word:"aide",meaning:"도움",pron:"에드"},{word:"votre",meaning:"당신의",pron:"보트르"}]},
{id:24,category:"감사·사과",kr:"친절하시네요.",fr:"C'est très gentil.",pronunciation:"세 트레 장티",grammar:"C'est는 '그것은 ~이다'예요. très는 '아주'라는 강조예요.",keywords:[{word:"gentil",meaning:"친절한",pron:"장티"},{word:"très",meaning:"아주",pron:"트레"}]},
{id:25,category:"식당",kr:"두 명 자리 부탁합니다.",fr:"Une table pour deux, s'il vous plaît.",pronunciation:"윈 타블 푸르 되 씰 부 플레",grammar:"s'il vous plaît는 '부탁합니다'로 요청 끝에 붙이면 정중해져요. 인원수만 바꿔 쓰면 돼요.",keywords:[{word:"table",meaning:"테이블",pron:"타블"},{word:"deux",meaning:"둘",pron:"되"}]},

{id:27,category:"식당",kr:"자리 있나요?",fr:"Vous avez une table ?",pronunciation:"부 자베 윈 타블",grammar:"끝을 올리기만 하면 의문문이 돼요. vous avez는 [부 자베]로 이어 읽어요.",keywords:[{word:"avez",meaning:"가지고 있다",pron:"아베"}]},

{id:30,category:"식당",kr:"주문할게요.",fr:"Je voudrais commander.",pronunciation:"즈 부드레 코망데",grammar:"je voudrais는 '~하고 싶습니다'라는 정중한 요청이에요. 여행 중 가장 많이 쓰게 될 표현이에요.",keywords:[{word:"voudrais",meaning:"~하고 싶다",pron:"부드레"},{word:"commander",meaning:"주문하다",pron:"코망데"}]},

{id:33,category:"식당",kr:"물 한 병 주세요.",fr:"Une carafe d'eau, s'il vous plaît.",pronunciation:"윈 카라프 도 씰 부 플레",grammar:"carafe d'eau는 무료로 주는 수돗물이에요. 유료 생수는 eau minérale이에요.",keywords:[{word:"eau",meaning:"물",pron:"오"},{word:"carafe",meaning:"물병",pron:"카라프"}]},
{id:34,category:"식당",kr:"냅킨 좀 주시겠어요?",fr:"Une serviette, s'il vous plaît.",pronunciation:"윈 세르비에트 씰 부 플레",grammar:"필요한 것 이름 + s'il vous plaît만으로도 충분히 정중한 요청이 돼요.",keywords:[{word:"serviette",meaning:"냅킨",pron:"세르비에트"}]},

{id:36,category:"카페·베이커리",kr:"카페라테 한 잔 주세요.",fr:"Un café au lait, s'il vous plaît.",pronunciation:"앙 카페 오 레 씰 부 플레",grammar:"au는 à + le의 축약으로 '~을 넣은'이라는 뜻이에요.",keywords:[{word:"lait",meaning:"우유",pron:"레"}]},

{id:39,category:"카페·베이커리",kr:"여기서 먹을게요.",fr:"Sur place.",pronunciation:"쉬르 플라스",grammar:"카페에서 '드시고 가세요, 가져가세요?'라고 물으면 이렇게 답해요.",keywords:[{word:"place",meaning:"자리",pron:"플라스"}]},
{id:40,category:"카페·베이커리",kr:"가져갈게요.",fr:"À emporter.",pronunciation:"아 앙포르테",grammar:"포장해 갈 때 쓰는 한마디예요. 파리 카페에서는 자리에서 먹을 때 값이 더 비싸요.",keywords:[{word:"emporter",meaning:"가져가다",pron:"앙포르테"}]},

{id:43,category:"음식 주문",kr:"추천해 주시겠어요?",fr:"Qu'est-ce que vous recommandez ?",pronunciation:"케스크 부 르코망데",grammar:"무엇을 먹을지 모를 때 가장 유용한 질문이에요. 현지인의 추천을 받을 수 있어요.",keywords:[{word:"recommander",meaning:"추천하다",pron:"르코망데"}]},

{id:45,category:"음식 주문",kr:"이거 하나 주세요.",fr:"Je voudrais ça, s'il vous plaît.",pronunciation:"즈 부드레 사 씰 부 플레",grammar:"메뉴를 가리키며 ça(그것)라고 하면 발음 걱정 없이 주문할 수 있어요.",keywords:[{word:"voudrais",meaning:"~하고 싶다",pron:"부드레"}]},

{id:47,category:"음식 주문",kr:"같은 걸로 주세요.",fr:"La même chose, s'il vous plaît.",pronunciation:"라 멤 쇼즈 씰 부 플레",grammar:"일행이 시킨 것과 같은 것을 주문할 때 써요.",keywords:[{word:"même",meaning:"같은",pron:"멤"},{word:"chose",meaning:"것",pron:"쇼즈"}]},
{id:48,category:"음식 주문",kr:"와인 한 잔 주세요.",fr:"Un verre de vin, s'il vous plaît.",pronunciation:"앙 베르 드 뱅 씰 부 플레",grammar:"un verre de + 음료로 '한 잔'을 표현해요. 레드는 vin rouge, 화이트는 vin blanc이에요.",keywords:[{word:"verre",meaning:"잔",pron:"베르"},{word:"vin",meaning:"와인",pron:"뱅"}]},
{id:49,category:"음식 주문",kr:"디저트 있나요?",fr:"Vous avez des desserts ?",pronunciation:"부 자베 데 데세르",grammar:"des는 복수 부정관사로 '몇 개의'라는 뜻이에요.",keywords:[{word:"dessert",meaning:"디저트",pron:"데세르"}]},
{id:50,category:"음식 주문",kr:"조금만 주세요.",fr:"Une petite portion, s'il vous plaît.",pronunciation:"윈 프티트 포르시옹 씰 부 플레",grammar:"portion이 여성 명사라 petit이 petite로 바뀌어요. 형용사는 명사의 성을 따라가요.",keywords:[{word:"portion",meaning:"양",pron:"포르시옹"}]},
{id:51,category:"메뉴 확인",kr:"이 안에 뭐가 들어 있나요?",fr:"Qu'est-ce qu'il y a dedans ?",pronunciation:"케스킬 리 아 드당",grammar:"il y a는 '~이 있다'예요. 영어의 there is에 해당하는 필수 표현이에요.",keywords:[{word:"il y a",meaning:"~이 있다",pron:"일 리 아"},{word:"dedans",meaning:"안에",pron:"드당"}]},
{id:52,category:"메뉴 확인",kr:"고기가 들어 있나요?",fr:"Est-ce qu'il y a de la viande ?",pronunciation:"에스킬 리 아 드 라 비앙드",grammar:"Est-ce que를 문장 앞에 붙이면 어떤 평서문도 의문문이 돼요.",keywords:[{word:"viande",meaning:"고기",pron:"비앙드"}]},
{id:53,category:"메뉴 확인",kr:"이거 매운가요?",fr:"C'est épicé ?",pronunciation:"세 테피세",grammar:"C'est와 épicé가 이어져 [세 테피세]로 발음돼요.",keywords:[{word:"épicé",meaning:"매운",pron:"에피세"}]},
{id:54,category:"메뉴 확인",kr:"채식 메뉴 있나요?",fr:"Vous avez un plat végétarien ?",pronunciation:"부 자베 앙 플라 베제타리앙",grammar:"végétarien은 채식주의의예요. 비건은 végétalien이라고 해요.",keywords:[{word:"végétarien",meaning:"채식의",pron:"베제타리앙"}]},
{id:55,category:"메뉴 확인",kr:"영어 메뉴판 있나요?",fr:"Vous avez une carte en anglais ?",pronunciation:"부 자베 윈 카르트 앙 낭글레",grammar:"en + 언어로 '~로 된'을 나타내요. en과 anglais가 이어져 [앙 낭글레]가 돼요.",keywords:[{word:"en anglais",meaning:"영어로",pron:"앙 낭글레"}]},
{id:56,category:"메뉴 확인",kr:"이거 어떻게 먹는 거예요?",fr:"Comment ça se mange ?",pronunciation:"코망 사 스 망주",grammar:"se manger는 '먹히다'라는 재귀 형태로 '어떻게 먹느냐'를 자연스럽게 물어요.",keywords:[{word:"manger",meaning:"먹다",pron:"망제"}]},
{id:57,category:"알레르기·요청",kr:"저는 견과류 알레르기가 있어요.",fr:"Je suis allergique aux noix.",pronunciation:"즈 쉬 잘레르지크 오 누아",grammar:"allergique à + 음식으로 알레르기를 말해요. aux는 à + les의 축약이에요.",keywords:[{word:"allergique",meaning:"알레르기의",pron:"알레르지크"},{word:"noix",meaning:"견과",pron:"누아"}]},

{id:59,category:"알레르기·요청",kr:"양파는 빼주세요.",fr:"Sans oignon, s'il vous plaît.",pronunciation:"상 오뇽 씰 부 플레",grammar:"빼고 싶은 재료 이름 앞에 sans만 붙이면 돼요. gn은 [뉴] 소리예요.",keywords:[{word:"oignon",meaning:"양파",pron:"오뇽"}]},
{id:60,category:"알레르기·요청",kr:"덜 맵게 해주세요.",fr:"Moins épicé, s'il vous plaît.",pronunciation:"무앙 제피세 씰 부 플레",grammar:"moins는 '덜'이라는 비교 표현이에요. 반대는 plus(더)예요.",keywords:[{word:"moins",meaning:"덜",pron:"무앙"}]},

function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
var toastEl = $('toast'), toastTimer = null;
function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 1900);
}

/* =========================================================
   localStorage (실패해도 앱이 멈추지 않도록 전부 방어 처리)
   ========================================================= */
var STORE_KEY = 'frTravelQuizSaved_v1';
var memoryFallback = [];      // localStorage를 못 쓰는 환경(사파리 프라이빗 등)용 임시 저장
var storageOK = true;

function loadSaved(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if (!raw) return [];
    var v = JSON.parse(raw);
    return Array.isArray(v) ? v : [];
  }catch(e){
    storageOK = false;
    return memoryFallback.slice();
  }
}
function writeSaved(list){
  memoryFallback = list.slice();
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify(list));
    return true;
  }catch(e){
    storageOK = false;
    return false;
  }
}
function isSaved(id){ return loadSaved().indexOf(id) !== -1; }
function addSaved(id){
  var list = loadSaved();
  if (list.indexOf(id) !== -1) return false;   // 중복 저장 방지
  list.push(id);
  writeSaved(list);
  return true;
}
function removeSavedId(id){
  writeSaved(loadSaved().filter(function(x){ return x !== id; }));
}

/* =========================================================
   발음 듣기 — Web Speech API (외부 TTS/음성 파일 없음)
   기기에 프랑스어 음성이 없으면 안내만 하고 앱은 계속 동작합니다.
   ========================================================= */
var frVoice = null, voicesChecked = false, noVoiceWarned = false;

function pickFrenchVoice(){
  if (!('speechSynthesis' in window)) return null;
  var voices = [];
  try{ voices = window.speechSynthesis.getVoices() || []; }catch(e){ return null; }
  if (!voices.length) return null;
  voicesChecked = true;
  for (var i = 0; i < voices.length; i++){
    if (voices[i].lang && voices[i].lang.toLowerCase().indexOf('fr') === 0) return voices[i];
  }
  return null;
}
if ('speechSynthesis' in window){
  try{
    frVoice = pickFrenchVoice();
    window.speechSynthesis.onvoiceschanged = function(){ frVoice = pickFrenchVoice(); };
  }catch(e){}
}
function speak(text){
  if (!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance === 'undefined'){
    showToast('이 브라우저는 발음 듣기를 지원하지 않아요');
    return;
  }
  try{
    window.speechSynthesis.cancel();
    if (!frVoice) frVoice = pickFrenchVoice();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'fr-FR';                       // 프랑스어 음성 우선
    if (frVoice) u.voice = frVoice;
    u.rate = 0.9;                           // 초급자를 위해 조금 느리게
    u.onerror = function(){ showToast('발음을 재생하지 못했어요'); };
    window.speechSynthesis.speak(u);
    if (!frVoice && voicesChecked && !noVoiceWarned){
      noVoiceWarned = true;
      showToast('기기에 프랑스어 음성이 없어요. 설정 › 손쉬운 사용 › 음성 콘텐츠에서 추가할 수 있어요');
    }
  }catch(e){
    showToast('발음 듣기를 사용할 수 없어요');
  }
}

/* =========================================================
   퀴즈 상태
   ========================================================= */
var currentCat = '전체';
var order = [];          // 현재 카테고리의 문제 인덱스 목록 (순서대로)
var pos = 0;
var revealed = false;
var finished = false;

function buildOrder(){
  order = [];
  for (var i = 0; i < DATA.length; i++){
    if (currentCat === '전체' || DATA[i].category === currentCat) order.push(i);
  }
  pos = 0;
  finished = false;
}
function currentItem(){ return DATA[order[pos]]; }

/* ---- 카테고리 칩 ---- */
function renderCatPicker(){
  var wrap = $('catPicker');
  wrap.innerHTML = '';
  ['전체'].concat(CATEGORIES).forEach(function(c){
    var b = document.createElement('button');
    b.className = 'pick' + (c === currentCat ? ' active' : '');
    b.textContent = c === '전체' ? '전체 ' + DATA.length : c;
    b.addEventListener('click', function(){
      currentCat = c;
      buildOrder();
      renderCatPicker();
      renderQuiz();
    });
    wrap.appendChild(b);
  });
}

/* ---- 헤더 ---- */
function updateHeader(){
  var total = order.length;
  var cur = finished ? total : (total ? pos + 1 : 0);
  $('catChip').textContent = finished
    ? (currentCat === '전체' ? '전체' : currentCat) + ' 완료'
    : (total ? currentItem().category : currentCat);
  $('progressText').textContent = cur + ' / ' + total;
  $('progressFill').style.width = (total ? (cur / total) * 100 : 0) + '%';
}

/* ---- 퀴즈 카드 ---- */
function renderQuiz(){
  if (finished){
    $('quizCard').style.display = 'none';
    $('doneCard').style.display = 'block';
    $('doneDesc').textContent = currentCat === '전체'
      ? '200문장을 모두 확인했어요. 다시 처음부터 복습해 볼까요?'
      : '「' + currentCat + '」 ' + order.length + '문장을 모두 확인했어요.';
    updateHeader();
    return;
  }
  $('quizCard').style.display = 'block';
  $('doneCard').style.display = 'none';

  var item = currentItem();
  if (!item) return;

  $('krQuestion').textContent = item.kr;
  $('frText').textContent = item.fr;
  $('pronText').textContent = item.pronunciation;
  $('grammarText').textContent = item.grammar;

  /* 핵심 단어 + 단어별 발음 듣기 */
  var kwList = $('kwList');
  kwList.innerHTML = '';
  var kws = item.keywords || [];
  $('kwRow').style.display = kws.length ? 'block' : 'none';
  kws.forEach(function(k){
    var box = document.createElement('div');
    box.className = 'kw';
    var main = document.createElement('div');
    main.className = 'kw-main';
    main.innerHTML = '<div class="kw-word">' + esc(k.word) + '</div>' +
                     '<div class="kw-mean">뜻: ' + esc(k.meaning) + '</div>' +
                     (k.pron ? '<div class="kw-pron">발음: ' + esc(k.pron) + '</div>' : '');
    var b = document.createElement('button');
    b.className = 'speak-btn small';
    b.textContent = '🔊';
    b.setAttribute('aria-label', k.word + ' 발음 듣기');
    b.addEventListener('click', function(e){ e.stopPropagation(); speak(k.word); });
    box.appendChild(main); box.appendChild(b);
    kwList.appendChild(box);
  });

  /* 상태 초기화 — 정답·문법·발음 모두 숨김 */
  revealed = false;
  $('answerBox').classList.remove('show');
  $('revealBtn').style.display = 'block';
  $('saveBtn').textContent = isSaved(item.id) ? '저장됨 ✓' : '헷갈려요 🔖';

  updateHeader();
}

function revealAnswer(){
  if (revealed || finished) return;
  revealed = true;
  $('answerBox').classList.add('show');
  $('revealBtn').style.display = 'none';
}
function nextQuestion(){
  if (finished) return;
  pos++;
  if (pos >= order.length){ finished = true; }
  renderQuiz();
}
function saveCurrent(){
  if (finished) return;
  var item = currentItem();
  if (isSaved(item.id)){
    showToast('이미 저장한 문장이에요 🔖');
    return;
  }
  addSaved(item.id);
  $('saveBtn').textContent = '저장됨 ✓';
  showToast(storageOK ? '오답노트에 저장했어요 🔖' : '저장했어요 (이 기기에는 영구 저장이 안 될 수 있어요)');
}
function restart(){
  buildOrder();
  renderQuiz();
  showToast('처음부터 다시 시작할게요!');
}

/* =========================================================
   저장된 단어장
   ========================================================= */
function renderSaved(){
  var ids = loadSaved();
  var wrap = $('savedList');
  wrap.innerHTML = '';
  $('savedCount').textContent = ids.length ? '저장한 문장 ' + ids.length + '개' : '';

  if (!ids.length){
    var e = document.createElement('div');
    e.className = 'empty';
    e.textContent = '아직 저장한 문장이 없어요.\n헷갈리는 표현을 🔖 저장해보세요!';
    wrap.appendChild(e);
    return;
  }

  ids.slice().reverse().forEach(function(id){
    var item = null;
    for (var i = 0; i < DATA.length; i++){ if (DATA[i].id === id){ item = DATA[i]; break; } }
    if (!item) return;

    var box = document.createElement('div');
    box.className = 'saved-item';

    var head = document.createElement('div');
    head.className = 'saved-head';
    var left = document.createElement('div');
    left.style.flex = '1';
    left.style.minWidth = '0';
    left.innerHTML = '<div class="saved-cat">' + esc(item.category) + '</div>' +
                     '<div class="saved-kr">' + esc(item.kr) + '</div>';
    var chev = document.createElement('span');
    chev.className = 'chev'; chev.textContent = '▶';
    head.appendChild(left); head.appendChild(chev);

    var detail = document.createElement('div');
    detail.className = 'saved-detail';

    /* 프랑스어 + 듣기 버튼 */
    var r1 = document.createElement('div');
    r1.className = 'row';
    r1.innerHTML = '<div class="row-label">① 프랑스어</div>';
    var line = document.createElement('div');
    line.className = 'fr-line';
    var frDiv = document.createElement('div');
    frDiv.className = 'fr-text'; frDiv.style.fontSize = '22px';
    frDiv.textContent = item.fr;
    var sb = document.createElement('button');
    sb.className = 'speak-btn'; sb.textContent = '🔊';
    sb.setAttribute('aria-label', '프랑스어 발음 듣기');
    sb.addEventListener('click', function(e){ e.stopPropagation(); speak(item.fr); });
    line.appendChild(frDiv); line.appendChild(sb);
    r1.appendChild(line);
    detail.appendChild(r1);

    /* 한글 발음 · 단어 · 문법 */
    var rest = document.createElement('div');
    var kwHtml = '';
    (item.keywords || []).forEach(function(k){
      kwHtml += '<div class="kw"><div class="kw-main">' +
        '<div class="kw-word">' + esc(k.word) + '</div>' +
        '<div class="kw-mean">뜻: ' + esc(k.meaning) + '</div>' +
        (k.pron ? '<div class="kw-pron">발음: ' + esc(k.pron) + '</div>' : '') +
        '</div></div>';
    });
    rest.innerHTML =
      '<div class="row"><div class="row-label">② 한글 발음</div>' +
        '<div class="pron-text">' + esc(item.pronunciation) + '</div></div>' +
      (kwHtml ? '<div class="row"><div class="row-label">③ 핵심 단어</div><div class="kw-list">' + kwHtml + '</div></div>' : '') +
      '<div class="row"><div class="grammar-box"><span class="glabel">💡 핵심 문법·문형 포인트</span>' +
        esc(item.grammar) + '</div></div>';
    detail.appendChild(rest);

    var actions = document.createElement('div');
    actions.className = 'saved-actions';
    var del = document.createElement('button');
    del.className = 'btn btn-danger';
    del.textContent = '삭제';
    del.addEventListener('click', function(e){
      e.stopPropagation();
      removeSavedId(item.id);
      showToast('삭제했어요');
      renderSaved();
      if (!finished && order.length && currentItem().id === item.id){
        $('saveBtn').textContent = '헷갈려요 🔖';
      }
    });
    actions.appendChild(del);
    detail.appendChild(actions);

    head.addEventListener('click', function(){
      var open = detail.classList.contains('show');
      detail.classList.toggle('show', !open);
      chev.classList.toggle('open', !open);
    });

    box.appendChild(head); box.appendChild(detail);
    wrap.appendChild(box);
  });
}

/* =========================================================
   탭 전환
   ========================================================= */
function switchTab(which){
  var quiz = (which === 'quiz');
  $('view-quiz').classList.toggle('active', quiz);
  $('view-saved').classList.toggle('active', !quiz);
  $('tabQuiz').classList.toggle('active', quiz);
  $('tabSaved').classList.toggle('active', !quiz);
  if (quiz){ updateHeader(); }
  else {
    renderSaved();
    var n = loadSaved().length;
    $('catChip').textContent = '저장된 단어장';
    $('progressText').textContent = n + '개';
    $('progressFill').style.width = (n ? 100 : 0) + '%';
  }
}

/* =========================================================
   이벤트 바인딩
   ========================================================= */
$('revealBtn').addEventListener('click', revealAnswer);
$('nextBtn').addEventListener('click', nextQuestion);
$('saveBtn').addEventListener('click', saveCurrent);
$('speakBtn').addEventListener('click', function(){ if (!finished) speak(currentItem().fr); });
$('restartBtn').addEventListener('click', restart);
$('allCatBtn').addEventListener('click', function(){
  currentCat = '전체';
  buildOrder(); renderCatPicker(); renderQuiz();
});
$('tabQuiz').addEventListener('click', function(){ switchTab('quiz'); });
$('tabSaved').addEventListener('click', function(){ switchTab('saved'); });

/* =========================================================
   초기화 — 첫 실행 시 1번 문제부터 순서대로
   ========================================================= */
buildOrder();
renderCatPicker();
renderQuiz();

/* =========================================================
   PWA / Service Worker
   -----------------------------------------------------------
   ※ 브라우저 보안 정책상 Service Worker는 HTTPS 또는 localhost
     에서만 등록됩니다. file:// 로 직접 열면 등록되지 않지만,
     아래 try/catch 덕분에 퀴즈 기능 자체는 그대로 동작합니다.
   ※ 앱의 모든 데이터·로직·CSS·JS가 이 index.html 안에 있으므로
     한 번 로드된 뒤에는 네트워크 없이도 학습을 이어갈 수 있습니다.
   ========================================================= */
(function(){
  try{
    var manifest = {
      name: '프랑스어 여행 회화 퀴즈',
      short_name: '프랑스어 여행',
      start_url: './',
      display: 'standalone',
      background_color: '#F2F2F7',
      theme_color: '#F2F2F7'
    };
    var url = URL.createObjectURL(new Blob([JSON.stringify(manifest)], {type:'application/json'}));
    var link = document.createElement('link');
    link.rel = 'manifest'; link.href = url;
    document.head.appendChild(link);
  }catch(e){ /* 무시 — 앱 동작에 영향 없음 */ }
})();

(function(){
  if (!('serviceWorker' in navigator)) return;   // 미지원 환경에서도 퀴즈는 정상 동작
  window.addEventListener('load', function(){
    try{
      navigator.serviceWorker.register('./sw.js').catch(function(err){
        console.log('Service Worker 등록 실패 (file:// 환경이면 정상입니다):', err);
      });
    }catch(e){}
  });
})();
</script>
